<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>يوتيوب</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Top Navbar -->
        <nav id="navbar">
            <div class="logo-container">
                <span class="material-symbols-rounded" style="color: #FF0000; font-size: 28px;">play_circle</span>
                <h2>YouTube</h2>
            </div>
            <div class="search-container">
                <input type="text" id="url-input" placeholder="البحث في يوتيوب..." dir="auto">
                <button id="add-btn"><span class="material-symbols-rounded">search</span></button>
            </div>
        </nav>

        <!-- Player Section (Hidden initially) -->
        <section id="player-section" style="display: none;">
            <div class="video-container">
                <img id="track-thumbnail" src="" alt="Thumbnail">
                <div class="video-controls-overlay">
                    <button id="play-btn" class="overlay-play-btn"><span class="material-symbols-rounded">pause</span></button>
                </div>
                <!-- YouTube Red Progress Bar -->
                <div class="yt-progress-container">
                    <input type="range" id="progress-bar" min="0" max="100" value="0">
                </div>
            </div>
            
            <div class="video-info">
                <h3 id="track-title">عنوان الفيديو</h3>
                <p id="track-artist">اسم القناة</p>
                <div class="time-info">
                    <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
                </div>
            </div>

            <!-- Action Buttons Row -->
            <div class="action-buttons">
                <button id="download-btn" class="action-btn">
                    <span class="material-symbols-rounded">download</span>
                    <span>تحميل</span>
                </button>
                <button id="prev-btn" class="action-btn">
                    <span class="material-symbols-rounded">skip_previous</span>
                    <span>السابق</span>
                </button>
                <button id="next-btn" class="action-btn">
                    <span class="material-symbols-rounded">skip_next</span>
                    <span>التالي</span>
                </button>
            </div>
            <div class="separator"></div>
        </section>

        <!-- Main Feed (Search Results / Playlist) -->
        <section id="feed-section">
            <div id="feed-header" style="display: none;">
                <h4>نتائج البحث</h4>
                <button id="clear-search-btn" style="display:none;"><span class="material-symbols-rounded">close</span></button>
            </div>
            <div id="status-bar" style="display:none;"></div>
            
            <!-- Video Cards will be injected here -->
            <div id="feed-list">
                <!-- Example Card Structure -->
                <!--
                <div class="video-card">
                    <div class="card-thumbnail">
                        <img src="..." alt="Thumb">
                        <span class="duration-badge">3:45</span>
                    </div>
                    <div class="card-details">
                        <h4 class="card-title">عنوان الفيديو</h4>
                        <p class="card-channel">اسم القناة</p>
                    </div>
                </div>
                -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
